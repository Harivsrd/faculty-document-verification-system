server:
  port: 8081

spring:
  application:
    name: faculty-credential-system

  datasource:
    url: jdbc:mysql://localhost:3306/faculty_credential_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: hari123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_MIN_256_BITS_FOR_HS256}
    expiration-ms: 86400000 # 24 hours

  file:
    upload-dir: ${UPLOAD_DIR:uploads}
    allowed-extensions: pdf,jpg,jpeg,png
    max-size-bytes: 10485760 # 10MB

  cors:
    allowed-origins: http://localhost:5173

  admin:
    seed:
      enabled: ${ADMIN_SEED_ENABLED:true}
      email: ${ADMIN_SEED_EMAIL:admin@faculty-system.local}
      password: ${ADMIN_SEED_PASSWORD:Admin@12345}
      name: ${ADMIN_SEED_NAME:System Administrator}

logging:
  level:
    com.example.faculty: INFO
    org.springframework.security: WARN
